<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="css/output.css">
    <link rel="stylesheet" href="font-icon/remixicon.css">
</head>

<body>
    <main class="w-full h-dvh mx-auto 2xl:container p-3 md:p-5 bg-pink-300">
        <div class="h-1/8 w-full flex justify-between items-center">
            <button class="_clear w-32 h-2/3 md:w-36 md:h-3/4 lg:w-40 cursor-pointer border-2 rounded-[10px] text-[15px] md:text-[16px] lg:text-[18px] text-red-700">clear completed</button>
            <h1 class="bg-pink-200 rounded-lg h-2/3 md:h-3/4 text-gray-700 flex items-center justify-center font-bold capitalize text-[5vw] md:text-[3vw] w-3/8 sm:w-4/8">todo list</h1>
            <div onclick="_dark(this)" class="border-2 w-12 h-12 md:w-14 md:h-14 rounded-4xl flex justify-center items-center cursor-pointer bg-[#aaddff]">
                <i class="ri-sun-fill text-yellow-500 flex text-4xl duration-300"></i>
                <i class="ri-moon-clear-fill hidden text-4xl duration-300"></i>
            </div>
        </div>
        <section class="row h-7/8 border-6 border-gray-900 rounded-lg p-2 md:p-4 bg-white">
            <div class="w-full md:w-1/2 h-1/2 md:h-full p-2">
                <ul class="border-4 rounded-md h-full border-gray-800">
                    <div class="_yellow w-full h-14 bg-yellow-500 border-b-2 p-1.5 flex">
                        <input id="inp" type="text" autofocus placeholder="write something" class="w-2/3 pl-2 border-2 rounded-[5px] outline-0 text-[18px]">
                        <button class="_btn cursor-pointer ml-5 w-1/4 border-2 rounded-lg capitalize text-[3vw] md:text-[2vw]">add task</button>
                    </div>
                    <div class="task w-full h-3/4 md:h-6/7 overflow-y-scroll">
                    
                    </div>
                </ul>
            </div>
            <div class="w-full md:w-1/2 h-1/2 md:h-full p-2">
                <ul class="border-4 rounded-md h-full border-gray-800">
                    <div class="_green w-full h-1/5 md:h-1/8 bg-green-500 border-b-2 flex justify-center items-center"><h2 class="uppercase text-2xl md:text-4xl font-bold">done</h2></div>
                    <div class="done w-full h-3/4 md:h-6/7 overflow-y-scroll">
                    
                    </div>
                </ul>
            </div>
        </section>
    </main>

    <section class="w-full 2xl:container mx-auto h-[70dvh] 2xl:h-[90dvh]">
        <div class="footer flex w-full h-full items-center bg-neutral-100 justify-center">
            <div class="w-5/6 md:w-2/3 lg:w-1/2 flex rounded-4xl">
                <figure class="w-3/5 pr-2"><img class="w-full h-full object-cover rounded-[70%_30%_40%_60%_/_30%_30%_70%_70%]" src="img/footer.png" alt=""></figure>
                <div class="w-2/5 pl-3">
                    <h2 class="capitalize font-bold text-[4vw] md:text-[3vw] lg:text-[2.5vw] mb-7 border-b-2 pb-0.5">saeed davoodi</h2>
                    <span class="flex"><a href="https://www.linkedin.com/in/saeed-davoodi-127412368?utm_source=share&utm_campaign=share_via&utm_content=profile&utm_medium=android_app" target="_blank" class="flex mb-3 ml-7"><i class="flex duration-300 hover:scale-[1.2] ri-linkedin-fill text-4xl md:text-5xl text-[#0a66c2]"></i></a></span>
                    <span class="flex"><a href="https://github.com/SaeedDavoodi-Dev" target="_blank" class="flex mb-3 ml-7"><i class="flex git duration-300 hover:scale-[1.2] ri-github-fill text-4xl md:text-5xl text-[#4c4c4d]"></i></a></span>
                    <span class="flex"><a href="https://www.instagram.com/saeed.davoodi_dev?igsh=MW8yazNpY2NzenV6Yg==" target="_blank" class="mb-3 ml-7"><i class="flex duration-300 hover:scale-[1.2] ri-instagram-fill text-4xl md:text-5xl text-[#ff0267]"></i></a></span>
                </div>
            </div>
        </div>
      </section>
</body>

<script src="js/master.js"></script>
</html>
